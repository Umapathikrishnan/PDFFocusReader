<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Focus Reader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-zinc-800 text-white min-h-screen flex flex-col items-center justify-center font-sans transition-colors duration-300 dark:bg-zinc-900 dark:text-gray-100 relative">
    
    <!-- Exit Focus Mode Button (Hidden by default) -->
    <button id="exit-focus-btn" class="hidden fixed top-4 right-4 z-50 px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded-full shadow-lg transition transform hover:scale-105 font-bold uppercase text-sm">
      Exit Focus
    </button>
    <h1 class="text-3xl font-bold mb-6 text-gray-100 dark:text-white">PDF Focus Reader</h1>

    <div class="bg-white/10 dark:bg-black/30 p-6 rounded-xl flex flex-wrap gap-4 justify-center items-center mb-6 shadow-lg backdrop-blur-sm w-[95%] max-w-4xl">
      <!-- File Input -->
      <input type="file" id="file-input" accept="application/pdf" class="block w-full text-sm text-gray-500
        file:mr-4 file:py-2 file:px-4
        file:rounded-full file:border-0
        file:text-sm file:font-semibold
        file:bg-blue-50 file:text-blue-700
        hover:file:bg-blue-100 dark:file:bg-slate-700 dark:file:text-blue-100
      "/>

      <!-- Controls Group -->
      <div class="flex flex-wrap gap-4 items-center justify-center">
          <!-- WPM Selector -->
          <div class="flex items-center gap-2">
            <label for="wpm-select" class="font-medium">Speed:</label>
            <select id="wpm-select" class="p-2 rounded bg-white dark:bg-slate-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-white focus:ring-2 focus:ring-blue-500">
                <option value="100">Focus (100)</option>
                <option value="150">Careful (150)</option>
                <option value="200" selected>Normal (200)</option>
                <option value="250">Balanced (250)</option>
                <option value="300">Fluent (300)</option>
                <option value="350">Fast (350)</option>
                <option value="450">Rapid (450)</option>
                <option value="600">Scan (600)</option>
                <option value="800">Hyper ⚠️ (800)</option>
                <option value="900">Ultra ⚠️ (900)</option>
                <option value="1000">Blitz ⚠️ (1000)</option>
                <option value="1500">Warp 🚨 (1500)</option>
                <option value="2000">Quantum 🚨 (2000)</option>
                <option value="custom">Custom...</option>
            </select>
            <input type="number" id="custom-wpm" placeholder="WPM" style="display: none;" class="p-2 w-20 rounded bg-white dark:bg-slate-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-white" />
          </div>

        <!-- Page Range -->
        <div class="flex items-center gap-2">
            <label class="font-medium">Pages:</label>
            <input type="number" id="start-page" placeholder="Start" min="1" class="p-2 w-20 rounded bg-white dark:bg-slate-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-white" />
            <span>to</span>
            <input type="number" id="end-page" placeholder="End" class="p-2 w-20 rounded bg-white dark:bg-slate-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-white" />
            <button id="update-range-btn" title="Reload Range" class="p-2 bg-gray-600 hover:bg-gray-700 text-white rounded transition">
                ↻
            </button>
        </div>

      <!-- Size Selector -->
      <div class="flex items-center gap-2">
        <label for="text-size" class="font-medium">Size:</label>
        <select id="text-size-select" class="p-2 rounded bg-white dark:bg-slate-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-white focus:ring-2 focus:ring-blue-500">
          <option value="1.5rem">Small</option>
          <option value="2rem" selected>Medium</option>
          <option value="3rem">Large</option>
          <option value="4rem">X-Large</option>
          <option value="5rem">Giant</option>
        </select>
      </div>

      <!-- Font Selector -->
      <div class="flex items-center gap-2">
        <label for="font-select" class="font-medium">Font:</label>
        <select id="font-select" class="p-2 rounded bg-white dark:bg-slate-700 border border-gray-300 dark:border-gray-600 text-gray-800 dark:text-white focus:ring-2 focus:ring-blue-500">
            <option value="Arial, sans-serif" selected>Arial (Sans)</option>
            <option value="'Times New Roman', serif">Times New Roman (Serif)</option>
            <option value="'Courier New', monospace">Courier New (Mono)</option>
            <option value="Georgia, serif">Georgia (Serif)</option>
            <option value="Verdana, sans-serif">Verdana (Sans)</option>
        </select>
      </div>
      
      <!-- Focus Toggle -->
       <div class="flex items-center gap-2">
           <input type="checkbox" id="focus-toggle" class="w-5 h-5 text-blue-600 rounded focus:ring-blue-500">
           <label for="focus-toggle" class="font-medium cursor-pointer">Red Focus Point</label>
       </div>

      <!-- Theme Toggle -->
      <button id="theme-toggle" class="px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white rounded transition">Dark Mode</button>
      
      <!-- Focus Mode Toggle -->
      <button id="focus-mode-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded transition">Focus Mode</button>
      </div>

       <!-- Color Palettes -->
       <div class="flex flex-col items-center gap-2 w-full mt-2">
        <div class="flex gap-3">
             <div class="palette-swatch w-8 h-8 rounded-full cursor-pointer border-2 border-transparent hover:scale-110 transition bg-[#CEE5D0]" data-bg="#CEE5D0" data-text="#2c3e50" title="Sage"></div>
             <div class="palette-swatch w-8 h-8 rounded-full cursor-pointer border-2 border-transparent hover:scale-110 transition bg-[#F3F0D7]" data-bg="#F3F0D7" data-text="#2c3e50" title="Beige"></div>
             <div class="palette-swatch w-8 h-8 rounded-full cursor-pointer border-2 border-transparent hover:scale-110 transition bg-[#F7D59C]" data-bg="#F7D59C" data-text="#2c3e50" title="Apricot"></div>
             <div class="palette-swatch w-8 h-8 rounded-full cursor-pointer border-2 border-transparent hover:scale-110 transition bg-[#5E454B]" data-bg="#5E454B" data-text="#f0f0f0" title="Eggplant"></div>
             <div id="custom-palette-btn" class="palette-swatch w-8 h-8 rounded-full cursor-pointer border-2 border-transparent hover:scale-110 transition flex items-center justify-center bg-gray-200 text-black font-bold text-xs" title="Custom" style="background: conic-gradient(red, yellow, lime, aqua, blue, magenta, red);">?</div>
        </div>
        
        <div id="custom-colors" class="hidden flex gap-2 animate-fade-in mt-2">
             <input type="color" id="text-color" value="#000000" class="w-8 h-8 p-0 border-0 rounded cursor-pointer">
             <input type="color" id="bg-color" value="#ffffff" class="w-8 h-8 p-0 border-0 rounded cursor-pointer">
        </div>
      </div>
    </div>
    
    <!-- Page Indicator -->
    <div id="page-indicator" class="w-[95%] md:w-[60%] text-right font-bold text-gray-500 dark:text-gray-400 mb-1 hidden">Page: <span id="current-page-num">-</span></div>

    <!-- Reader Box -->
    <div id="box" class="w-[95%] md:w-[60%] h-[200px] bg-[#00c3ff] text-black text-4xl font-bold flex items-center justify-center text-center overflow-auto resize-y border border-gray-300 dark:border-gray-600 rounded-xl mb-6 p-6 shadow-xl leading-relaxed">
      Results will appear here. Please select a PDF file.
    </div>

    <!-- Reading Buttons -->
    <div class="buttons flex flex-wrap gap-4 justify-center mb-8">
      <button id="start-btn" class="px-8 py-3 bg-gradient-to-r from-green-500 to-green-700 hover:from-green-600 hover:to-green-800 text-white font-bold rounded-full shadow-lg shadow-green-500/50 hover:scale-105 active:scale-95 transition-all duration-300 uppercase tracking-wide">Start Reading</button>
      <button id="pause-btn" style="display: none;" class="px-8 py-3 bg-gradient-to-r from-yellow-400 to-yellow-600 hover:from-yellow-500 hover:to-yellow-700 text-black font-bold rounded-full shadow-lg shadow-yellow-500/50 hover:scale-105 active:scale-95 transition-all duration-300 uppercase tracking-wide">Pause</button>
      <button id="continue-btn" style="display: none;" class="px-8 py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 text-white font-bold rounded-full shadow-lg shadow-cyan-500/50 hover:scale-105 active:scale-95 transition-all duration-300 uppercase tracking-wide">Continue</button>
      <button id="reset-btn" style="display: inline-block;" class="px-8 py-3 bg-gradient-to-r from-red-500 to-red-700 hover:from-red-600 hover:to-red-800 text-white font-bold rounded-full shadow-lg shadow-red-500/50 hover:scale-105 active:scale-95 transition-all duration-300 uppercase tracking-wide">Reset</button>
    </div>

    <!-- PDF Preview Element -->
    <div id="preview-container" class="hidden w-full max-w-[600px] text-center mt-6 fade-in">
        <label class="block font-bold mb-3 text-gray-300 text-lg">Page Preview</label>
        <canvas id="pdf-render" class="w-full border-2 border-gray-600 shadow-2xl rounded-xl mx-auto"></canvas>
        <div class="pdf-controls flex justify-center items-center gap-6 mt-6">
            <button id="prev-page" class="px-5 py-2 bg-gradient-to-r from-gray-600 to-gray-800 hover:from-gray-500 hover:to-gray-700 text-white rounded-full shadow-md hover:scale-105 transition-all duration-200">Previous</button>
            <span id="page-count-display" class="font-bold text-gray-300 text-lg bg-black/40 px-4 py-1 rounded-full">Page <span id="preview-page-num" class="text-blue-400">-</span> of <span id="total-pages">-</span></span>
            <button id="next-page" class="px-5 py-2 bg-gradient-to-r from-gray-600 to-gray-800 hover:from-gray-500 hover:to-gray-700 text-white rounded-full shadow-md hover:scale-105 transition-all duration-200">Next</button>
        </div>
    </div>

    <script type="module" src="./script.js"></script>
    <script type="module" src="./index.js"></script>
  </body>
</html>
